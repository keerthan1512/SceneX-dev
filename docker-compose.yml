services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenesolver-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override only the values that differ inside Docker
      - MONGODB_URL=${MONGODB_URL} # Atlas URL — sourced from backend/.env
      - DATABASE_NAME=scenesolver
      - STORAGE_PATH=/app/storage
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      # These come from backend/.env via env_file below
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - CLIP_MODEL_NAME=${CLIP_MODEL_NAME:-openai/clip-vit-base-patch32}
      - YOLO_MODEL_PATH=/app/models/yolo_crime.pt
      - CLIP_CLASSIFIER_PATH=/app/models/saved_model.joblib
      - CLIP_LABEL_ENCODER_PATH=/app/models/label_encoder.joblib
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20}
    env_file:
      - ./backend/.env
    volumes:
      - backend_storage:/app/storage
      - backend_models:/app/models
    networks:
      - scenesolver-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scenesolver-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - scenesolver-net

volumes:
  backend_storage:
  backend_models:

networks:
  scenesolver-net:
    driver: bridge
